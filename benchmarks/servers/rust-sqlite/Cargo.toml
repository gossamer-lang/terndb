[package]
name = "rust-sqlite"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
